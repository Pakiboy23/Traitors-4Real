name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 to match ios/App/ci_scripts/ci_post_clone.sh, which needs it:
      # @capacitor/cli declares engines >=22.0.0 and refuses to run below that.
      # This job never invokes the CLI — it stops at native:web:build — so it
      # passed on Node 20 while the Xcode Cloud sync could not run at all.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test --if-present

      # `npm run build` uses `next build --webpack`. Turbopack's Google Font
      # download does not retry a fonts.gstatic.com miss and fails CI as
      # Module not found for @vercel/turbopack-next/internal/font/google/font.
      - name: Build (Next.js)
        env:
          # Next.js inlines NEXT_PUBLIC_* at build time. Real values come from
          # repository secrets when available; the fallbacks keep CI meaningful
          # on forks by exercising the same code path with placeholder config.
          # The anon key is safe to expose either way — it ships in the client
          # bundle by design and is governed by row-level security.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        # next/font downloads Google CSS during the build. A short response
        # throws in the loader and is not retried, so the job tries again.
        run: |
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if npm run build; then
              exit 0
            fi
            echo "next build failed (attempt ${attempt})"
            attempt=$((attempt + 1))
            sleep 5
          done
          exit 1

      - name: Build (Capacitor bundled web assets)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: |
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if npm run native:web:build; then
              exit 0
            fi
            echo "native web build failed (attempt ${attempt})"
            attempt=$((attempt + 1))
            sleep 5
          done
          exit 1
