name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No test runner is configured yet, so this is a deliberate no-op today.
      # It is wired up now so that adding a "test" script to package.json is
      # enough to make scoring tests gate every PR, with no workflow change.
      - name: Test
        run: npm test --if-present

      - name: Build (Next.js)
        env:
          # Next.js inlines NEXT_PUBLIC_* at build time. Real values come from
          # repository secrets when available; the fallbacks keep CI meaningful
          # on forks by exercising the same code path with placeholder config.
          # The anon key is safe to expose either way — it ships in the client
          # bundle by design and is governed by row-level security.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npm run build

      - name: Build (Capacitor bundled web assets)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npm run native:web:build
