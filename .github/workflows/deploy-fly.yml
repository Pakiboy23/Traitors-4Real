# RETIRED — this pipeline deploys the pre-April 2026 architecture.
#
# Production now runs the Next.js app on Vercel against Supabase. This workflow
# still deploys the PocketBase backend to Fly.io and the old Vite frontend, and
# smoke-checks api.traitorsfantasydraft.online, which is no longer the API.
#
# The automatic push trigger has been removed so that merging to main can no
# longer resurrect the retired stack. It is kept behind manual dispatch only as
# a rollback path; delete this file once the Fly apps are decommissioned.
name: Deploy (Fly, retired)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PB_APP: traitorsfantasydraft-pb
  WEB_APP: traitorsfantasydraft-web
  PB_URL: https://api.traitorsfantasydraft.online
  WEB_URL: https://traitorsfantasydraft.online

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy PocketBase
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -a "${PB_APP}"

      - name: Smoke check PocketBase
        run: |
          set -e
          for i in {1..20}; do
            echo "Attempt $i..."
            if curl -fsS "${PB_URL}/api/health" >/dev/null; then
              echo "PocketBase healthy"
              exit 0
            fi
            sleep 3
          done
          echo "PocketBase health check failed"
          exit 1

  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Frontend (uses fly.frontend.toml)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -c fly.frontend.toml -a "${WEB_APP}"

      - name: Smoke check Frontend
        run: |
          set -e
          for i in {1..20}; do
            echo "Attempt $i..."
            if curl -fsS "${WEB_URL}/status" >/dev/null; then
              echo "Frontend healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend health check failed"
          exit 1
